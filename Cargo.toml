[package]
name = "psmc-rs"
version = "0.2.0"
edition = "2024"
# let chains (Rust 1.88), and ratatui's dependencies (instability, darling,
# time) declare 1.88 too.
rust-version = "1.88"
description = "PSMC (Li and Durbin 2011): infers the history of effective population size from one diploid genome, with C psmc's model"
license = "MIT"
repository = "https://github.com/larryivan/psmc-rs"
readme = "README.md"
keywords = ["psmc", "coalescent", "demography", "population-genetics", "genomics"]
categories = ["science::bioinformatics", "command-line-utilities"]
# The crate holds the program and the one data file its unit tests read; the
# experiments, manuscript, integration tests and their data stay in the
# repository.
include = [
    "/src/", "/Cargo.toml", "/Cargo.lock", "/README.md", "/CHANGELOG.md", "/LICENSE",
    "/tests/data/psmc_out/printf_golden.tsv",
]

[[bin]]
name = "psmc-rs"
path = "src/bin/psmc/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "wrap_help"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
foldhash = "0.2"
indicatif = "0.17"
memchr = "2.7"
ndarray = "0.15"
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The numerical tests (C equivalence, simulation checks) run full EM fits;
# optimise them while keeping debug assertions and overflow checks on.
[profile.test]
opt-level = 2
