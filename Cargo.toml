[package]
name = "psmc-rs"
version = "0.2.0"
edition = "2024"
# let chains (Rust 1.88), and ratatui's dependencies (instability, darling,
# time) declare 1.88 too.
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "psmc-rs"
path = "src/bin/psmc/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
indicatif = "0.17"
ndarray = { version = "0.15", features = ["rayon"] }
rayon = "1.10"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
ratatui = "0.30.0"
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The numerical tests (C equivalence, simulation checks) run full EM fits;
# optimise them while keeping debug assertions and overflow checks on.
[profile.test]
opt-level = 2
