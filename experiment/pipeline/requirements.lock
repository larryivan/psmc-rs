# The exact Python environment of the experiment pipeline (python -m experiment.pipeline).
#
# The pipeline regenerates its large inputs that are not committed (simulated
# genomes, VCFs, masks) from the seeds and relies on them being byte-identical,
# so that the committed fits stay done in a clone. That holds only with these
# exact versions (msprime, tskit, numpy and stdpopsim above all; scipy for E5
# and E6). `python -m experiment.pipeline tools` and `start` warn when the
# running interpreter differs from this file. Install with:
#     python3.13 -m venv experiment/.venv
#     experiment/.venv/bin/python -m pip install -r experiment/pipeline/requirements.lock
# python==3.13.13
