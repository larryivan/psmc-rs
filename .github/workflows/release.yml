name: Release

on:
  push:
    tags:
      - "v*"
  # By hand (Actions tab): build and check a tag's binaries; a release is
  # made only when `publish` is ticked.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example: v0.2.0)"
        required: true
        type: string
      publish:
        description: "Also make the draft release"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc: the oldest glibc the binary is linked for (see the build
          # steps); 2.17 is Rust's own minimum.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            glibc: "2.17"
            archive_ext: tar.gz
            bin_name: psmc-rs
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            bin_name: psmc-rs
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            bin_name: psmc-rs
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      # The rustc that built the production binary behind the manuscript's
      # results (1.99.0), and no cache: a release is built from scratch.
      # Move the pin on purpose.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}

      # Linked against the runner's glibc (2.39), the Linux binary would not
      # start on glibc 2.33 or older (RHEL/Rocky 8, Ubuntu 20.04, Debian 11),
      # and on 2.34 to 2.38 every run would print "weak version `GLIBC_2.39'
      # not found". cargo-zigbuild links it with zig against the symbols of
      # the glibc in matrix.glibc instead; rustc generates the same code.
      - name: Install Python (Linux)
        if: matrix.glibc
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig and cargo-zigbuild (Linux)
        if: matrix.glibc
        run: |
          python -m pip install --only-binary=:all: ziglang==0.16.0 cargo-zigbuild==0.23.4
          python -m ziglang version
          cargo-zigbuild --version

      - name: Build release binary (Linux, glibc ${{ matrix.glibc }})
        if: matrix.glibc
        run: cargo zigbuild --release --locked --bin psmc-rs --target ${{ matrix.target }}.${{ matrix.glibc }}

      - name: Build release binary
        if: ${{ !matrix.glibc }}
        run: cargo build --release --locked --bin psmc-rs --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          NAME="psmc-rs-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.${{ matrix.archive_ext }}" "${NAME}"
          # Hash from inside dist/, so that the file names in the checksums
          # are those of the downloaded assets.
          (cd dist && shasum -a 256 "${NAME}.${{ matrix.archive_ext }}" > "${NAME}.${{ matrix.archive_ext }}.sha256")

      # The binary of the archive: no glibc symbol newer than the floor;
      # --version and a short fit in CentOS 7, Rocky Linux 8 and 9 and Ubuntu
      # 22.04 containers, with nothing on standard error; and in Rocky Linux
      # 9 that fit equal to the production binary's (tests/data/release_check).
      - name: Check the Linux binary on older distributions
        if: matrix.glibc
        run: .github/scripts/check-linux-binary.sh "dist/psmc-rs-${RELEASE_TAG}-${{ matrix.target }}.${{ matrix.archive_ext }}" "${{ matrix.glibc }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  # A draft: publishing it (by hand, after checking it) is what makes
  # Zenodo archive the release and mint its DOI.
  publish:
    name: Draft GitHub Release
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    needs: build
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # perl's shasum (the one of macOS) reads a CR at the end of a line as
      # part of the file name, where GNU sha256sum drops it: checking with
      # shasum makes sure each list works on macOS too, against the assets.
      - name: Build consolidated checksums
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS.txt
          cd dist
          for list in *.sha256 SHA256SUMS.txt; do
            shasum -a 256 -c "$list"
          done

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS.txt
